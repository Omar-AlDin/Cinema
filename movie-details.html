<!DOCTYPE html>
<html lang="en">
<!-- Home, Genres, Browse, Search, Details -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title"></title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="ambient-glow"></div>

    <header class="head-bar head-bar--overlay">
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="genres.html">Genres</a>
            <a href="browse.html">Browse</a>
            <a href="search.html">Search</a>

        </nav>
    </header>
    <div class="backdrop-wrapper">
        <img class="backdrop" src="" alt="">
        <div class="backdrop-fade"></div>
    </div>
    <main class="page-container">
        <!-- <nav class="main-nav">
            <a href="index.html" class="active-top">Home</a>
            <a href="genres.html">Genres</a>
            <a>Browse</a>
            <a>Search</a>

        </nav> -->
        <section class="details">
            <!-- <div class="backdrop-wrapper">
                <img class="backdrop" src="" alt="everything everywhere">
                <div class="backdrop-fade"></div>
            </div> -->
            <!-- <img class="poster" src="" alt="everything everywhere"> -->

        </section>



        <section class="details-bottom">

            <aside class="left-column">
                <img class="poster hidden" src="" alt="">

                <div class="genres hidden">
                    <span class="genre-pill"></span>
                    <span class="genre-pill"></span>
                    <span class="genre-pill"></span>
                </div>

                <button class="btn-trailer hidden">▶ Watch Trailer</button>

                <div class="status">
                    <div class="date-group">
                        <p class="date-label"></p>
                        <span class="date-span"></span>
                        </p>
                    </div>
                    <p class="revenue">Country: <span class="origin-country"></span></p>
                    <p class="language">Original Language: <span class="language-span"></span></p>
                    <div class="budget-revenue">
                        <p class="budget">Budget: <span class="budget-span"></span></p>

                        <p class="revenue">Revenue: <span class="revenue-span"></span></p>

                    </div>

                </div>
            </aside>
            <div class="right-column">
                <div class="details-info">
                    <div class="title">
                        <h2 id="title"></h2>

                        <a href="index.html#hidden-gems" class="gem hidden ">
                            <i data-lucide="gem" class="gem-badge"></i>
                            <span>Gem</span>
                            <span class="tooltip">Our hidden gems</span>
                        </a>

                    </div>
                    <div class="title-info">
                        <span class="rating">⭐ <strong id="movie-rating"></strong><span
                                class="max-score">/10</span></span>

                        <span class="upcoming hidden">
                            <i data-lucide="calendar" class="icon-badge"></i>
                            <span>UPCOMING</span>
                        </span>

                        <span class="dot">•</span>
                        <span id="release-year"></span>
                        <span class="dot">•</span>
                        <span id="movie-certification"></span>
                        <span class="dot">•</span>
                        <span id="runtime"></span>
                    </div>

                    <p class="tagline"></p>
                    <p class="overview">

                    </p>

                </div>
                <div class="sub-crew">
                    <p class="director">Directors: <span id="director-span"></span></p>

                    <p class="writer">Writers: <span id="writer-span"></span></p>
                </div>
                <h2>Cast</h2>
                <div class="cast-list">

                    <div class="cast-member">

                        <!--                 
                    <div class="cast-member">
                        <img class="cast-image" src="cast-2.jpg" alt="Ke Huy Quan">
                        <p class="actor-name">Ke Huy Quan</p>
                        <p class="character-name">Waymond Wang</p>
                    </div> -->


                        <button class="btn-view-more">View More</button>

                    </div>


                </div>
                <section class="media-section">
                    <div class="media-nav">

                        <nav>
                            <h2>Media</h2>
                            <button class="btn-popular" data-tab="popular">Most Popular</button>
                            <button class="btn-videos" data-tab="videos">Videos</button>
                            <button class="btn-backdrops" data-tab="backdrops">Backdrops</button>
                            <button class="btn-posters" data-tab="posters">Posters</button>
                        </nav>

                    </div>
                    <div class="media-scroll">

                    </div>
                </section>

        </section>
        <!-- repeat for however many cast dummy entries you want -->


    </main>
    <div class="modal hidden">
        <div class="overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="trailer-name">Official Trailer</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <iframe class="trailer-frame" src="" allowFullscreen></iframe>
            </div>
        </div>
    </div>
    <script src="cinema.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
