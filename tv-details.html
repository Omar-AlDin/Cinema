<!DOCTYPE html>
<html lang="en">
<!-- Home, Genres, Browse, Search, Details -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title"></title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="ambient-glow"></div>
    <header class="head-bar">
        <nav class="main-nav">
            <a href="index.html" class="active-top">Home</a>
            <a href="genres.html">Genres</a>
            <a href="browse.html">Browse</a>
            <a>Search</a>

        </nav>
    </header>
    <div class="backdrop-wrapper-tv">
        <img class="backdrop-tv" src="" alt="">
        <div class="backdrop-fade-tv"></div>
    </div>
    <main class="page-container">
        <!-- <nav class="main-nav">
            <a href="index.html" class="active-top">Home</a>
            <a href="genres.html">Genres</a>
            <a>Browse</a>
            <a>Search</a>

        </nav> -->
        <section class="details">
            <!-- <div class="backdrop-wrapper">
                <img class="backdrop" src="" alt="everything everywhere">
                <div class="backdrop-fade"></div>
            </div> -->
            <!-- <img class="poster" src="" alt="everything everywhere"> -->

        </section>



        <section class="details-bottom">

            <aside class="left-column">
                <img class="poster" src="" alt="">

                <div class="genres hidden">
                    <span class="genre-pill"></span>
                    <span class="genre-pill"></span>
                    <span class="genre-pill"></span>
                </div>

                <button class="btn-trailer hidden">▶ Watch Trailer</button>

                <div class="status">
                    <p class="date">Release Date: <span class="date-span"></span></p>

                    <p class="language">Original Language: <span class="language-span"></span></p>

                    <p class="episode">Next Episode: <span class="next-episode"></span></p>

                    <p class="networks">Networks: <span class="networks-span"></span></p>
                    <p class="total-episodes">Total Episodes: <span class="total-episodes-span"></span></p>



                </div>
            </aside>
            <div class="right-column">
                <div class="details-info">
                    <h2 id="title"></h2>
                    <div class="title-info">
                        <span class="rating">⭐ <strong id="rating-tv"></strong><span class="max-score">/10</span></span>
                        <span class="dot">•</span>
                        <span id="release-year"></span>
                        <span class="dot">•</span>
                        <span id="movie-certification"></span>
                        <span class="dot-time">•</span>
                        <span id="runtime"></span>
                    </div>

                    <p class="tagline"></p>
                    <p class="overview">

                    </p>

                </div>
                <div class="sub-crew">

                    <p class="writer">Created By: <span id="creator-span"></span></p>
                </div>
                <button class="episode-btn">Episodes</button>

                <div class="season-table">

                    <div class="season-scroller">
                        <h>Seasons</h>
                        <button class="season-btn">S1</button>
                        <button class="season-btn">S2</button>

                    </div>
                    <div class="season-episodes">
                        <span class=season-number>S1 <span class="season-number">Episodes</span><strong
                                id="ep-rating"></strong>
                            8.1</strong></span>
                    </div>
                </div>
                <h2>Cast</h2>
                <div class="cast-list">

                    <div class="cast-member">

                        <!-- <img src="cast-1.jpg" alt="Michelle Yeoh">
                        <p class="actor-name">Michelle Yeoh</p>
                        <p class="character-name">Evelyn Wang</p>
                    </div>
                    <div class="cast-member">
                        <img class="cast-image" src="cast-2.jpg" alt="Ke Huy Quan">
                        <p class="actor-name">Ke Huy Quan</p>
                        <p class="character-name">Waymond Wang</p>
                    </div>
                    <div class="cast-member">
                        <img src="cast-3.jpg" alt="Jenny Slate">
                        <p class="actor-name">Jenny Slate</p>
                        <p class="character-name">Debbie the Dog Mom</p> -->
                    </div>

                    <button class="btn-view-more">View More</button>

                </div>

                <section class="media-section">
                    <div class="media-nav">

                        <nav>
                            <h2>Media</h2>
                            <button class="btn-popular" data-tab="popular">Most Popular</button>
                            <button class="btn-videos" data-tab="videos">Videos</button>
                            <button class="btn-backdrops" data-tab="backdrops">Backdrops</button>
                            <button class="btn-posters" data-tab="posters">Posters</button>
                        </nav>

                    </div>
                    <div class="media-scroll">

                    </div>
                </section>
            </div>

        </section>
        <!-- repeat for however many cast dummy entries you want -->


    </main>
    <div class="modal hidden">
        <div class="overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Official Trailer</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <iframe class="trailer-frame" src="" allowFullscreen></iframe>
            </div>
        </div>
    </div>
    <script src="cinema.js"></script>
</body>

</html>
