<svg width="100%" viewBox="0 0 364 364" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Seamless tileable film-themed doodle pattern</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A small repeatable tile of film icons (reels, clapperboards, tickets, popcorn, play buttons) designed so edges line up seamlessly when the image is repeated as a CSS background.</desc>
<defs>

<g id="reel"><circle class="ic" r="14"/><circle class="ic" r="2.5" cx="0" cy="-7"/><circle class="ic" r="2.5" cx="6" cy="4"/><circle class="ic" r="2.5" cx="-6" cy="4"/></g>
<g id="clap"><rect class="ic" x="-14" y="-3" width="28" height="17" rx="2"/><path class="ic" d="M-14,-3 L-8,-13 M-2,-3 L4,-13 M10,-3 L14,-10"/></g>
<g id="ticket"><rect class="ic" x="-16" y="-7" width="32" height="14" rx="2"/><circle class="ic" r="2.5" cx="-9" cy="0"/><circle class="ic" r="2.5" cx="9" cy="0"/></g>
<g id="play"><path class="ic" d="M-8,9 L0,-10 L8,9 Z"/></g>
<g id="popcorn"><rect class="ic" x="-12" y="-14" width="24" height="30" rx="3"/><polygon class="ic" points="-2,-6 -2,6 5,0"/></g>
<g id="star"><polygon class="ic" points="-8,-10 8,-10 11,10 -11,10"/><line class="ic" x1="-8" y1="-1" x2="9" y2="-1"/></g>
</defs>
<rect x="0" y="0" width="340" height="340" fill="#0c0c0e" style="fill:rgb(12, 12, 14);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

