<!DOCTYPE html>
<html lang="en">
<!-- Home, Genres, Browse, Search, Details -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Cafe</title>
    <link rel="stylesheet" href="style.css">


</head>

<body>
    <header class="head-bar">

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="genres.html" class="active-top">Genres</a>
            <a href="browse.html">Browse</a>
            <a href="search.html">Search</a>

        </nav>
    </header>

    <main class="genre-page">
        <section class="genre-section">
            <h3 class="genre-header">Movies</h3>
            <div class="genre-container">
                <div class="genre-card horror" style="--genre-color: #8b0000">
                    <div class="card-img">
                        <img src="movie-4.jpg" alt="Horror">
                    </div>
                    <span class="genre-title">Horror</span>
                </div>
                <div class="genre-card comedy" style="--genre-color: #0090e0">
                    <div class="card-img">
                        <img src="comedy.jpg" alt="Comedy">
                    </div>
                    <span class="genre-title">Comedy</span>
                </div>
                <div class="genre-card romance" style="--genre-color: #c9184a ">
                    <div class="card-img">
                        <img src="romance.jpg" alt="romance">
                    </div>
                    <span class="genre-title">Romance</span>

                </div>
                <div class="genre-card action" style="--genre-color: #1E3A8A ">
                    <div class="card-img">
                        <img src="action2.jpeg" alt="action">
                    </div>
                    <span class="genre-title">Action</span>

                </div>

                <div class="genre-card drama" style="--genre-color: #116b38 ">
                    <div class="card-img">
                        <img src="drama.jpg" alt="Drama">
                    </div>
                    <span class="genre-title">Drama</span>

                </div>

                <div class="genre-card thriller" style="--genre-color: #331C2D ">
                    <div class="card-img">
                        <img src="thriller.jpg" alt="Thriller">
                    </div>
                    <span class="genre-title">Thriller</span>

                </div>

                <div class="genre-card sci-fi" style="--genre-color: #0a536a ">
                    <div class="card-img">
                        <img src="sci-fi-format.jpg" alt="Sci-Fi">
                    </div>
                    <span class="genre-title">Sci-Fi</span>
                </div>

                <div class="genre-card crime" style="--genre-color: #1E293B ">
                    <div class="card-img">
                        <img src="crime7.jpg" alt="Crime">
                    </div>
                    <span class="genre-title">Crime</span>

                </div>

                <div class="genre-card documentary" style="--genre-color: #78350F ">
                    <div class="card-img">
                        <img src="documentary4.jpg" alt="Documentary">
                    </div>
                    <span class="genre-title">Documentary</span>

                </div>

                <div class="genre-card animation" style="--genre-color: #4F46E5 ">
                    <div class="card-img">
                        <img src="animation.jpg" alt="Animation">
                    </div>
                    <span class="genre-title">Animation</span>

                </div>
            </div>
        </section>

        <section class="genre-section">
            <h3 class="genre-header">TV Shows</h3>
            <div class="genre-container">

                <div class="genre-card drama-tv" style="--genre-color: #15803D">
                    <div class="card-img">
                        <img src="drama-tv3.jpg" alt="Drama">
                    </div>
                    <span class="genre-title">Drama</span>
                </div>

                <div class="genre-card comedy-tv" style="--genre-color: #0284C7">
                    <div class="card-img">
                        <img src="comedy-tv.jpg" alt="Comedy">
                    </div>
                    <span class="genre-title">Comedy / <br>Sitcom</span>
                </div>

                <div class="genre-card sci-fi-tv" style="--genre-color: #0D9488">
                    <div class="card-img">
                        <img src="sci-fi-tv.jpg" alt="Sci-Fi">
                    </div>
                    <span class="genre-title">Sci-Fi &<br>Fantasy</span>
                </div>

                <div class="genre-card action-tv" style="--genre-color: #1D4ED8">
                    <div class="card-img">
                        <img src="action-tv2.jpg" alt="Action & Adventure">
                    </div>
                    <span class="genre-title">Action &<br>Adventure</span>
                </div>


            </div>
        </section>
    </main>

    <script src="cinema.js"></script>

</body>

</html>
