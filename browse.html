<!DOCTYPE html>
<html lang="en">
<!-- Home, Genres, Browse, Search, Details -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Cafe</title>
    <link rel="stylesheet" href="style.css">


</head>

<body>
    <header class="head-bar">

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="genres.html">Genres</a>
            <a href="browse.html" class="active-top">Browse</a>
            <a href="search.html">Search</a>

        </nav>
    </header>
    <main class="browse-container">
        <nav class="sub-nav">

            <a href="browse.html" class="active">Movies</a>
            <a href="tvshow.html">TV Shows</a>

        </nav>
        <section class="select-section">
            <div class="select-group">
                <label for="select-sort">Sort By</label>
                <select id="select-sort" autocomplete="off">
                    <option value="popularity.desc">Most Popular</option>
                    <option value="vote_average.desc">Highest Rated</option>
                    <option value="primary_release_date.desc">Newest Releases</option>


                </select>
            </div>

            <div class="select-group">
                <label for="genre-select">Genre</label>
                <select id="genre-select" autocomplete="off">
                    <option value="">All Genres</option>
                </select>
            </div>

            <div class="select-group">
                <label for="year-sort">Year</label>
                <select id="year-sort" autocomplete="off">
                    <option value="">All Years</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                    <option value="2017">2017</option>
                    <option value="2016">2016</option>
                    <option value="2015">2015</option>
                    <option value="2014">2014</option>
                    <option value="2013">2013</option>
                    <option value="2012">2012</option>
                    <option value="2011">2011</option>
                    <option value="2010">2010</option>

                </select>
            </div>
            <div class="select-group">
                <label for="rating-select">Rating</label>
                <select id="rating-select" autocomplete="off">
                    <option value="">All Ratings</option>
                    <option value="9">9+ Stars</option>

                    <option value="8">8+ Stars</option>
                    <option value="7">7+ Stars</option>
                    <option value="6">6+ Stars</option>
                </select>
            </div>

            <div class="select-group">
                <label for="language-select">Language</label>
                <select id="language-select" autocomplete="off">
                    <option value="">International</option>
                    <option value="ar">Arabic</option>
                    <!-- <option value="en">International</option> -->
                </select>
            </div>
        </section>
        <section class="trending">
            <!-- <h2>Trending Movies</h2> -->
            <div class="movies-grid">



            </div>

            <div class="load-more-container">
                <button id="load-more-btn" style="display: none;">Load More</button>
            </div>
            <div id="scroll-sentinel"></div>
        </section>
    </main>

    <script src="cinema.js"></script>

</body>

</html>
